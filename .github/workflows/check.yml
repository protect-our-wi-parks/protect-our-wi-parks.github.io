# The robot checker.
# Every time someone saves a change on GitHub, a robot computer checks our files for mistakes.
# ✅ green check = all good.  ❌ red X = something is broken: click it to see what to fix.
# It only checks. It never changes our files.

name: Check the app

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get our files
        uses: actions/checkout@v7

      - name: Check app.js for typos
        run: node --check app.js

      - name: Check plant-helper.js for typos
        run: node --check --input-type=module < plant-helper.js

      - name: Check the plant list, the front-page plants, and that no secret key was pasted in
        run: |
          node <<'EOF'
          const fs = require("fs");
          let problems = 0;

          // Print a problem in plain words, pointing at the file to fix.
          function problem(file, words) {
            console.log(`::error file=${file}::${words}`);
            problems++;
          }

          // Read a JSON file. If a comma or quote is missing, say so.
          function readJson(file) {
            try {
              return JSON.parse(fs.readFileSync(file, "utf8"));
            } catch (error) {
              problem(file, `This file is broken (often a missing comma or quote). Details: ${error.message}`);
              return null;
            }
          }

          // The plant list: every plant needs all its parts.
          const list = readJson("invasive-plants.json");
          const seen = new Set();
          const categories = ["prohibited", "restricted", "depends-on-county", "not-regulated"];
          for (const plant of (list && list.plants) || []) {
            const name = plant.commonName || plant.scientificName || "a plant";
            if (!plant.scientificName || !plant.scientificName.includes(" ")) problem("invasive-plants.json", `${name}: scientificName needs two words, like "Alliaria petiolata".`);
            if (!Array.isArray(plant.otherNames)) problem("invasive-plants.json", `${name}: otherNames must be a list, like [] or ["Old name"].`);
            if (!plant.commonName) problem("invasive-plants.json", `${name}: commonName is missing.`);
            if (!categories.includes(plant.category)) problem("invasive-plants.json", `${name}: category must be one of: ${categories.join(", ")}.`);
            if (!plant.why) problem("invasive-plants.json", `${name}: "why" (one sentence) is missing.`);
            if (plant.dnrPage && !/^https:\/\/dnr\.wisconsin\.gov\/topic\/Invasives\/fact\/[A-Za-z]+$/.test(plant.dnrPage)) problem("invasive-plants.json", `${name}: dnrPage should look like https://dnr.wisconsin.gov/topic/Invasives/fact/PlantName`);
            if (plant.category === "not-regulated" && (!plant.infoPage || !plant.infoSource)) problem("invasive-plants.json", `${name}: a not-regulated plant needs infoPage (a link) and infoSource (who wrote it).`);
            for (const n of [plant.scientificName, ...(plant.otherNames || [])]) {
              const key = String(n).toLowerCase();
              if (seen.has(key)) problem("invasive-plants.json", `${n} is listed twice.`);
              seen.add(key);
            }
          }
          if (list) console.log(`Checked ${list.plants.length} plants.`);

          // Groups: every kind in a group must be in the plant list.
          const groups = (list && list.groups) || [];
          for (const group of groups) {
            if (!Array.isArray(group.members) || group.members.length === 0) problem("invasive-plants.json", `${group.commonName}: a group needs "members", a list of scientific names.`);
            for (const m of group.members || []) if (!seen.has(String(m).toLowerCase())) problem("invasive-plants.json", `${group.commonName}: "${m}" is in the group but not in the plant list.`);
            if (!group.why) problem("invasive-plants.json", `${group.commonName}: "why" (one sentence) is missing.`);
          }

          // The plant list cards (plants and groups): each needs its place, a "Look for" line, a photo that exists, and a credit.
          const places = new Set();
          for (const plant of [...((list && list.plants) || []), ...groups].filter((p) => "frontPage" in p)) {
            const name = plant.commonName || "a plant";
            if (!Number.isInteger(plant.frontPage) || places.has(plant.frontPage)) problem("invasive-plants.json", `${name}: frontPage must be a whole number that no other plant uses.`);
            places.add(plant.frontPage);
            if (!plant.lookFor) problem("invasive-plants.json", `${name}: "lookFor" (how to spot it) is missing.`);
            if (!plant.photo || !fs.existsSync(plant.photo)) problem("invasive-plants.json", `${name}: the photo "${plant.photo}" is missing. Upload it to the photos folder.`);
            else if (!/\.(jpe?g|png)$/i.test(plant.photo)) problem("invasive-plants.json", `${name}: the photo must be a .jpg, .jpeg or .png file (take a screenshot of it and upload that).`);
            if (!plant.photoCredit || !plant.photoCreditUrl) problem("invasive-plants.json", `${name}: photoCredit and photoCreditUrl (who took the photo) are needed.`);
          }
          console.log(`Checked ${places.size} front-page plants.`);

          // Version stickers: style.css?v= and app.js?v= in index.html should have the same number.
          const page = fs.readFileSync("index.html", "utf8");
          const css = (page.match(/style\.css\?v=(\d+)/) || [])[1], js = (page.match(/app\.js\?v=(\d+)/) || [])[1];
          if (!css || css !== js) problem("index.html", `The version stickers don't match (style.css?v=${css}, app.js?v=${js}). Use the same number for both.`);

          // Safety: a Pl@ntNet key must never be in our public code. It belongs only in Cloudflare.
          for (const file of ["app.js", "index.html", "style.css", "plant-helper.js", "invasive-plants.json", "README.md", "EXPLAIN.md"]) {
            if (/2b10[A-Za-z0-9]{18,}/.test(fs.readFileSync(file, "utf8"))) problem(file, "This looks like a Pl@ntNet key! Remove it right away and tell an adult to make a new key. Keys only go in Cloudflare.");
          }

          if (problems) {
            console.log(`❌ Found ${problems} problem(s). Fix them and save again.`);
            process.exit(1);
          }
          console.log("✅ Everything looks good!");
          EOF
